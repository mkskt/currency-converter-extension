<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Currency Converter - Blacklist Manager</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f8fafc;
            color: #1e293b;
            margin: 0;
            padding: 40px;
            display: flex;
            justify-content: center;
            transition: background-color 0.2s, color 0.2s;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
            width: 100%;
            max-width: 650px;
            transition: background-color 0.2s;
        }
        h1 {
            font-size: 24px;
            margin-top: 0;
            margin-bottom: 8px;
            color: #0f172a;
            transition: color 0.2s;
        }
        p {
            color: #64748b;
            font-size: 14px;
            margin-bottom: 24px;
            transition: color 0.2s;
        }
        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        input[type="text"] {
            flex: 1;
            padding: 11px 14px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 14px;
            outline: none;
            background-color: white;
            color: #0f172a;
            transition: border-color 0.2s, background-color 0.2s, color 0.2s;
        }
        input[type="text"]:focus {
            border-color: #3b82f6;
        }
        button {
            padding: 11px 20px;
            background: #3b82f6;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            transition: background 0.2s;
        }
        button:hover {
            background: #2563eb;
        }
        .chips-container {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 15px;
            max-height: 450px;
            overflow-y: auto;
            padding: 4px;
        }
        .chip {
            display: inline-flex;
            align-items: center;
            background: #e2e8f0;
            color: #334155;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 500;
            word-break: break-all;
            border: 1px solid #cbd5e1;
            transition: background-color 0.2s, color 0.2s, border-color 0.2s;
        }
        /* PERFECTLY CENTERED "X" REMOVAL ICON BUTTON TWEAK */
        .chip .remove-btn {
            margin-left: 10px;
            cursor: pointer;
            color: #94a3b8;
            font-weight: bold;
            font-size: 14px;
            line-height: 1;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            transition: all 0.2s;
        }
        .chip .remove-btn:hover {
            color: #ffffff;
            background: #ef4444;
        }
        .empty-state {
            color: #94a3b8;
            font-size: 14px;
            text-align: center;
            padding: 40px 20px;
            width: 100%;
            border: 2px dashed #e2e8f0;
            border-radius: 8px;
            transition: color 0.2s, border-color 0.2s;
        }

        /* DARK THEME LAYOUT RULES */
        body.dark {
            background-color: #0f172a;
            color: #f8fafc;
        }
        body.dark .container {
            background-color: #1e293b;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.3);
        }
        body.dark h1 {
            color: #f8fafc;
        }
        body.dark p {
            color: #94a3b8;
        }
        body.dark input[type="text"] {
            background-color: #0f172a;
            border-color: #334155;
            color: #f8fafc;
        }
        body.dark input[type="text"]:focus {
            border-color: #3b82f6;
        }
        body.dark .chip {
            background-color: #334155;
            color: #cbd5e1;
            border-color: #475569;
        }
        body.dark .chip .remove-btn:hover {
            color: #ffffff;
            background: #ef4444;
        }
        body.dark .empty-state {
            color: #475569;
            border-color: #334155;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Blacklist Manager</h1>
        <p>Enter full URLs or specific domains below. The extension will completely sleep on these paths.</p>
        
        <div class="input-group">
            <input type="text" id="url-input" placeholder="e.g., youtube.com or https://claude.ai/upgrade/pro">
            <button id="add-btn">Add Path</button>
        </div>
        
        <div class="chips-container" id="chips-container">
            </div>
    </div>
    <script src="blacklist.js"></script>
</body>
</html>
